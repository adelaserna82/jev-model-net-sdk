name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test Jev.slnx -c Release
      - run: dotnet run --project samples/Jev.Console -c Release -- mixed --simulate
      - run: dotnet pack src/Jev.Sdk -c Release -o artifacts/packages
      - run: dotnet pack src/Jev.Sdk.Extensions.DependencyInjection -c Release -o artifacts/packages
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.os }}
          path: artifacts/packages/*.nupkg
