name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, such as v0.3.0
        required: true
      publishNuget:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Validate version tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          VERSION=$(dotnet msbuild src/TypedDecisions.Sdk -getProperty:Version)
          test "$RELEASE_TAG" = "v$VERSION"
      - run: dotnet test TypedDecisions.slnx -c Release
      - run: dotnet pack src/TypedDecisions.Sdk -c Release -o artifacts/packages
      - run: dotnet pack src/TypedDecisions.Sdk.Extensions.DependencyInjection -c Release -o artifacts/packages
      - uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: artifacts/packages/*.nupkg
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG"; then
            gh release create "$RELEASE_TAG" artifacts/packages/*.nupkg --verify-tag --generate-notes
          fi
  nuget:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publishNuget }}
    needs: package
    runs-on: ubuntu-latest
    environment: nuget
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: packages
      - name: Publish
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: dotnet nuget push 'packages/*.nupkg' --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
