name: typeddecisions-laya

services:
  laya-serve:
    # Docker construye el Dockerfile oficial de Laya en este commit fijo.
    # Ahí se instalan Python 3.11, PyTorch CPU y la dependencia [serve].
    build:
      context: https://github.com/NandhaKishorM/laya.git#23a17522aa4942da6cce53a995a275760320b691
      args:
        TORCH_INDEX: cpu
        TORCH_VERSION: "2.14.0"
    command: ["laya-serve"]
    ports:
      - "127.0.0.1:${LAYA_PORT:-8000}:${LAYA_PORT:-8000}"
    environment:
      LAYA_HOST: 0.0.0.0
      LAYA_PORT: "${LAYA_PORT:-8000}"
      LAYA_DEVICE: cpu
      LAYA_PRELOAD: "1"
      LAYA_MODELS: multilingual
      LAYA_THREADS: "4"
      OMP_NUM_THREADS: "4"
      HF_HUB_OFFLINE: "${HF_HUB_OFFLINE:-0}"
      LAYA_API_KEY: "${LAYA_API_KEY:-}"
    volumes:
      - model-cache:/home/laya/.cache/huggingface
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.environ['LAYA_PORT'] + '/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10m
      start_interval: 2s

volumes:
  model-cache:
    name: typeddecisions-laya-model-cache
